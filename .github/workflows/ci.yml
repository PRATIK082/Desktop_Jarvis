name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        node-version: ["20", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Node dependencies
        run: npm ci --workspaces

      - name: Install Python dependencies
        run: |
          pip install -e services/assistant
          pip install ruff mypy pytest pytest-asyncio

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Frontend type check
        run: npx tsc --noEmit
        working-directory: apps/desktop

      - name: Frontend lint
        run: npx eslint .
        working-directory: apps/desktop

      - name: Frontend format check
        run: npx prettier --check .
        working-directory: apps/desktop

      - name: Frontend tests
        run: npx vitest run
        working-directory: apps/desktop

      - name: Backend lint
        run: ruff check src/jarvis/
        working-directory: services/assistant

      - name: Backend type check
        run: mypy src/jarvis/
        working-directory: services/assistant

      - name: Backend tests
        run: pytest
        working-directory: services/assistant

      - name: Rust check
        run: cargo check
        working-directory: apps/desktop/src-tauri

  dependency-audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Node dependencies
        run: npm ci --workspaces

      - name: Install Python dependencies
        run: pip install -e services/assistant

      - name: npm audit
        run: npm audit --workspaces || true

      - name: pip audit
        run: pip audit || true

      - name: Review lockfile changes
        run: git diff --exit-code -- package-lock.json services/assistant/requirements.txt || echo "Lockfile changes detected - review before merging"
