[package]
name = "jarvis-desktop"
version = "0.1.0"
edition = "2021"
description = "JARVIS desktop Tauri backend (Rust)"
rust-version = "1.99"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
strip = true
lto = true

[[bin]]
name = "jarvis-desktop"
path = "src/main.rs"
